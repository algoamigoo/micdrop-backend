services:
  - type: web
    name: micdrop-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: micdrop-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false # set to https://<your-frontend>.vercel.app
      - key: FRONTEND_URL
        sync: false # set to https://<your-frontend>.vercel.app/auth/callback
      - key: GOOGLE_REDIRECT_URL
        sync: false # set to https://<your-backend>.onrender.com/api/v1/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info

databases:
  - name: micdrop-db
    plan: free
